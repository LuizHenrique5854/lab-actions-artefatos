name: Aprendendo Artefatos

on: 
  workflow_dispatch:

  schedule:
    - cron: '0 2 * * *'

  push:
    branches:
      - 'feature/**'
    paths:
      - 'src/**'
      - '!src/docs/**'

jobs:
  gerador: 
    name: Produzir Arquivo
    runs-on: ubuntu-latest
    steps:
      - name: Criar relatório de teste
        run: |
          mkdir saida_build
          echo "Sucesso! Relatório 1 gerado em $(date)" > saida_build/relatorio1.txt
          echo "Sucesso! Relatório 2 gerado em $(date)" > saida_build/relatorio2.txt

      - name: Salvar Artefato
        uses: actions/upload-artifact@v4 
        with:
          name: meus-relatorios-oficiais
          path: saida_build 

  consumidor: 
    name: Ler Arquivo
    runs-on: ubuntu-latest
    needs: [gerador] 
    steps:
      - name: Recuperar Artefato
        uses: actions/download-artifact@v4 
        with:
          name: meus-relatorios-oficiais 

      - name: Listar arquivos
        run: ls -R

      - name: Exibir Conteúdo
        run: cat relatorio1.txt